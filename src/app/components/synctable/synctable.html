<div class="container">
  <h2>Bank Loan Portfolio Overview</h2>

  <div class="controls">
    <label class="file-btn">
      <input type="file" accept=".json,application/json" (change)="onFileSelected($event)" />
      Import
    </label>

    <button (click)="exportJson()" [disabled]="rowData.length === 0">Export</button>
  </div>

  <div class="messages">
    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
    <div *ngFor="let err of errors" class="error">{{ err }}</div>
  </div>

  <div class="grid-wrapper">
    <ejs-grid [dataSource]="rowData" [allowPaging]="true" [pageSettings]="{ pageSize: 100 }" height="400">
      <e-columns>
        <e-column *ngFor="let c of columns"
                  [field]="c.field"
                  [headerText]="c.headerText"
                  [width]="c.width || 120">
        </e-column>
      </e-columns>
    </ejs-grid>
  </div>
</div>
